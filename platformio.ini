; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples	
; https://docs.platformio.org/page/projectconf.html

[env]
platform = teensy
board = teensy41
framework = arduino
lib_deps = 
	ssilverman/QNEthernet@^0.26.0
	robtillaart/ANSI@^0.3.2
	arkhipenko/TaskScheduler@^3.8.5
build_flags = -D PERFORM_CHECKS '-D ENV_NAME="$PIOENV"'
monitor_speed = 115200 

[env:debug]
build_flags =  -D IGNORE_ERRORS -D ACTIVE_PAIRS=3 -D DEBUG_OUTPUT -D USE_ETHERNET '-D ENV_NAME="$PIOENV"'


[env:pia]
build_flags = ${env.build_flags} -D ACTIVE_PAIRS=1


[env:paris]
build_flags = ${env.build_flags} -D ACTIVE_PAIRS=1


[env:paul]
build_flags = ${env.build_flags} -D USE_ETHERNET  -D DEBUG_OUTPUT -D ACTIVE_PAIRS=2