; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = teensy
board = teensy41
framework = arduino
lib_deps = 
	ssilverman/QNEthernet@^0.26.0
	robtillaart/ANSI@^0.3.2
build_flags = -D PERFORM_CHECKS 

[env:debug]
build_flags = ${env.build_flags} -D IGNORE_ERRORS -D ACTIVE_PAIRS=2 -D DEBUG_OUTPUT


[env:pia]
build_flags = ${env.build_flags} -D ACTIVE_PAIRS=2

[env:paul]
build_flags = ${env.build_flags} -D USE_ETHERNET -D SERIAL_TUNING -D ACTIVE_PAIRS=3